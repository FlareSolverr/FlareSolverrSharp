name: publish to nuget

on:
  push:
    branches:
      - master
    paths:
      - src/FlareSolverrSharp/FlareSolverrSharp.csproj

permissions:
  contents: read

jobs:
  publish:
    name: build, pack & publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build package
        shell: bash
        run: dotnet pack -c Release --include-symbols -p:SymbolPackageFormat=snupkg -o packages src/FlareSolverrSharp/FlareSolverrSharp.csproj

      - name: NuGet Login
        uses: nuget/login@v1.2.0
        id: nuget-login
        with:
          user: "${{ secrets.NUGET_USER }}"

      - name: Push package to NuGet
        run: dotnet nuget push packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
